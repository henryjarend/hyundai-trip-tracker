name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing in here writes anywhere, including to the registry.
permissions:
  contents: read

# A force-push or a second commit makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Node in mise.toml, so CI and a developer's machine cannot end up
      # on different majors — which for this repo would mean CI silently testing
      # against a runtime that cannot strip types.
      - uses: jdx/mise-action@v5

      - run: npm ci

      - run: npm run typecheck

      # No credentials and no database needed: the geocoding tests skip themselves when
      # Postgres is unreachable, which is exactly the case here.
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      # The whole history, not the default single commit: a secret deleted in a later
      # commit is still public in the one that added it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only the scanner. Node is the other job's business.
      - uses: jdx/mise-action@v5
        with:
          install_args: github:betterleaks/betterleaks

      # Redacted because this log is public: a leak reported in full here would be a
      # second leak. False positives are filtered in .betterleaks.toml. Live validation
      # stays off, so no candidate secret is ever sent to a third-party API.
      - run: betterleaks git . --redact --no-banner -v

  image:
    # Builds without pushing, so a broken Dockerfile surfaces on the pull request. At
    # release time the only way to fix one is another release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The default docker driver cannot export a GitHub Actions cache; buildx can, and
      # `npm ci` plus the Vite build are most of this image's build time.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
