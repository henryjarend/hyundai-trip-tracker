name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keeps a release pull request open against main, accumulating the conventional-commit
  # subjects since the last release. Merging that PR is what cuts a release: it bumps the
  # version, writes CHANGELOG.md, tags the commit and publishes a GitHub release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      # `release-type: node` needs no config file: it reads the version from the root
      # package.json and updates it, package-lock.json and CHANGELOG.md in the PR.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  publish:
    # This has to hang off the job that cut the release rather than live in its own
    # `on: push: tags` workflow. Release-please tags with the default GITHUB_TOKEN, and
    # events raised by that token never start another workflow run — a tag-triggered
    # build would simply never fire.
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit that was released, not whatever main has moved on to.
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR accepts the workflow's own token, so there is no secret to rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # ghcr.io/<owner>/<repo> — the package lands on the repository page, which is
          # the point of using GHCR rather than a registry somewhere else.
          images: ghcr.io/${{ github.repository }}
          # Explicit rather than metadata-action's `type=semver`, because that reads the
          # git ref and this job runs on a branch push, not on the tag.
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            type=raw,value=${{ needs.release-please.outputs.major }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Carries org.opencontainers.image.source, which is what links the published
          # package back to this repository and its commit.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
